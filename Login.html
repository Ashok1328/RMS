<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Form Validation</title>
  </head>
  <body>
    
    <section
      class="flex items-center justify-center min-h-screen bg-violet-400">
      <div class="relative flex flex-col m-6 space-y-8 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 drop-shadow-black">
      
        <div class="flex flex-col justify-center p-8 md:p-14">
          <span class="mb-3 text-4xl font-bold">Register</span>
          <p class="text-red-300" id="error-message"></p>
          <form action="">
            <div class="py-2 relative">
              <span class="mb-2 text-md">Username</span>
              <div class="absolute left-2 mt-1.5 bg-gray-300 rounded-full p-2 flex items-center justify-center">
                <i class="fas fa-user"></i>
              </div>
              <input
                type="text"
                class="w-full py-2 px-12 bg-gray-200 border border-gray-300 rounded-md palceholder:font-light placeholder:text-gray-500  focus:bg-gray-300 focus:outline-none focus:ring focus:ring-black focus:drop-shadow-lg hover:bg-gray-400 hover:text-black hover:border hover:border-black"
                name="username"
                id="username"
                placeholder="Username"
              />
            </div>
          <div class="py-2 relative">
            <span class="mb-2 text-md">Email</span>
            <div class="absolute left-2 mt-1.5 bg-gray-300 rounded-full p-2 flex items-center justify-center">
              <i class="fas fa-envelope"></i>
            </div>
            <input
              type="text"
              class="w-full py-2 px-12 bg-gray-200 border border-gray-300 rounded-md placeholder:font-light placeholder:text-gray-500  focus:bg-gray-300 focus:outline-none focus:ring focus:ring-black focus:drop-shadow-lg hover:bg-gray-400 hover:text-black hover:border hover:border-black"
              name="email"
              id="email"
              placeholder="Email Address"
            />
          </div>

          <div class="py-4 relative">
            <span class="mb-2 text-md">Password</span>
            <div class="absolute left-2 mt-1.5 bg-gray-300 rounded-full p-2 flex items-center justify-center">
              <i class="fas fa-lock"></i>
            </div>
            <input
              type="password"
              class="w-full py-2 px-12 bg-gray-200 border border-gray-300 rounded-md palceholder:font-light placeholder:text-gray-500 focus:bg-gray-300 focus:outline-none focus:ring focus:ring-black focus:drop-shadow-lg  hover:bg-gray-400 hover:text-black hover:border hover:border-black"
              name="password"
              id="password"
              placeholder="Password"
            />
          </div>
          <div class="py-4 relative">
            <span class="mb-2 text-md">Confirm Password</span>
            <div class="absolute left-2 mt-1.5 bg-gray-300 rounded-full p-2 flex items-center justify-center">
              <i class="fas fa-lock"></i>
            </div>
            <input
              type="password"
              class="w-full py-2 px-12 bg-gray-200 border border-gray-300 rounded-md palceholder:font-light placeholder:text-gray-500 focus:bg-gray-300 focus:outline-none focus:ring focus:ring-black focus:drop-shadow-lg  hover:bg-gray-400 hover:text-black hover:border hover:border-black"
              name="repeat-password"
              id="repeat-password"
              placeholder="Confirm Password"
            />
          </div>
          <button
            class="w-full bg-black text-white p-2 rounded-lg mb-6 cursor-pointer hover:bg-gray-400 hover:text-black hover:border hover:border-black"
          >
            Sign Up
          </button>
        </form>
          <div class="text-center text-gray-400">
            Dont' have an account?
            <span class="font-bold text-black "> <a href="./index.html">Sign In</a></span>
          </div>
        </div>
        <div class="relative">
          <img
            src="./re.jpg"
            alt=""
            class="w-[450px] h-100 mt-25 ml-6 md:block"
          />
        </div>
      </div>
    </section>
  </body>
  <script src="./validation.js"></script>
</html>
